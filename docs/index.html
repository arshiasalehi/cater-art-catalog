<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Static product catalog for Cater Art, built from the Shopify CSV export."
    />
    <title>Cater Art Products</title>
    <link rel="stylesheet" href="./assets/site.css" />
  </head>
  <body data-page="list">
    <div class="site-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Cater Art</p>
          <h1>Product catalog</h1>
          <p class="lede">
            A simple static list built from the CSV export. Click any product to
            open its detail page with images, price, and the product fields that
            matter.
          </p>
        </div>

        <div class="hero-meta" aria-label="Catalog stats">
          <div class="stat">
            <strong id="total-count">0</strong>
            <span>Total products</span>
          </div>
          <div class="stat">
            <strong id="active-count">0</strong>
            <span>Active products</span>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Product filters">
        <label class="search">
          <span>Search</span>
          <input
            id="search-input"
            type="search"
            placeholder="Title, artist, vendor, tag, handle"
            autocomplete="off"
          />
        </label>
      </section>

      <p id="results-count" class="results-count" aria-live="polite">
        Loading products...
      </p>

      <main>
        <ul id="product-list" class="product-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state" hidden>
          No products match this search.
        </p>
      </main>
    </div>

    <script type="module" src="./assets/site.js"></script>
  </body>
</html>
